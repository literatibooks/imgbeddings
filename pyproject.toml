[project]
name = "imgbeddings"
version = "0.1.0"
description = "A Python package to generate image embeddings with CLIP without PyTorch/TensorFlow"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Max Woolf", email = "max@minimaxir.com"}
]
keywords = [
    "ai",
    "transformers",
    "onnx",
    "images",
    "image-processing",
    "embeddings",
    "clip"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
    "transformers>=4.17.0",
    "onnxruntime>=1.10.0",
    "Pillow",
    "tqdm",
    "scikit-learn"
]

[project.urls]
Homepage = "https://github.com/minimaxir/imgbeddings"
Repository = "https://github.com/minimaxir/imgbeddings.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imgbeddings"]

[dependency-groups]
dev = [
    "ipython>=7.34.0",
]
